security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        token_verification_hasher:
            algorithm: 'sodium'
        refresh_token_hasher:
            algorithm: 'sodium'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Authentication\Entity\User
                property: username
    firewalls:
        # Nelmio API
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Endpoints
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Authentication\Security\ActiveUserChecker
            entry_point: jwt
            json_login:
                check_path: api_auth_login
                username_path: username
                password_path: password
                success_handler: App\Authentication\Security\AuthenticationSuccessHandler
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            jwt: ~
            custom_authenticators:
                - App\Authentication\Security\RefreshTokenAuthenticator
            logout:
                path: api_auth_logout
